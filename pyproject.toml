[build-system]
# 77: the licence as an SPDX expression, with license-files (PEP 639).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "getelec"
version = "3.1.0"
description = "General Tool for Electron Emission Calculations: thermal-field emission current density and Nottingham heat for metals and semiconductors"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
# Names only, so PyPI lists the three together and in this order: setuptools
# moves an author given with an email into a separate Author-email field. The
# contact address is the maintainer's.
authors = [
  { name = "Salvador Barranco Cárceles" },
  { name = "Andreas Kyritsakis" },
  { name = "Anthony Ayari" },
]
maintainers = [{ name = "Salvador Barranco Cárceles", email = "s.barranco.carceles@gmail.com" }]
keywords = ["field emission", "electron emission", "Nottingham effect", "Fowler-Nordheim", "tunnelling"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
# NumPy 2: np.trapezoid, which the energy integrals use, does not exist in 1.x.
# SciPy 1.13 and Numba 0.60 are the first releases built for NumPy 2.
dependencies = ["numpy>=2.0", "scipy>=1.13", "numba>=0.60"]

[project.optional-dependencies]
# There are deliberately no user-facing extras: `pip install getelec` is the one
# install. Plotting needs matplotlib and training a NeuralSolver model
# (getelec.training) needs scikit-learn, each installed on its own by whoever
# wants it; using a trained model needs only NumPy.
# There is deliberately no "gui" extra either: the GUI is not part of the pip package.
# It runs from a checkout of the repository (python gui.py) or as the
# standalone application built by compile.py.
# "dev" is what a contributor installs, so it has to produce a working GUI as
# well as a working test run -- previously it left out PyQt, so `python gui.py`
# failed straight after a documented install. No PyQt6-WebEngine: the GUI opens
# its documentation in the system browser.
dev = [
  "pytest>=7.4",            # the test suite
  "matplotlib>=3.7",        # every example, and the GUI plots
  "nbformat>=5.9",          # the tutorial notebook and its test
  "ipykernel>=6.0",         # runs the notebook on this environment (VS Code needs only this)
  "notebook>=7.0",          # `jupyter notebook`, to run it in a browser instead
  "scikit-learn>=1.3",      # training NeuralSolver models (not needed to use them)
  "PyQt6>=6.5",             # gui.py
  "pandas>=2.0",            # GUI: reading measured data files
  "openpyxl>=3.1",          # GUI: .xlsx files (pandas reads them through it)
  "xlrd>=2.0",              # GUI: legacy .xls files
  "pyinstaller>=6.0",       # compile.py
]

[project.urls]
Homepage = "https://github.com/sbcarceles13/GETELEC"

[tool.setuptools.packages.find]
include = ["getelec*"]

# The trained NeuralSolver weights. Inside the package, so they ship with pip;
# loaded through importlib.resources, so they are found however it is installed.
[tool.setuptools.package-data]
getelec = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# gui.py, gui_backend.py and compile.py sit at the repository root, and the
# tests import them. Without this, plain `pytest` fails where
# `python -m pytest` succeeds, because only the latter puts the current
# directory on sys.path.
pythonpath = ["."]
